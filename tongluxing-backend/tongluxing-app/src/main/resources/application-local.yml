spring:
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_MYSQL_URL:${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/tongluxing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}}
    username: ${LOCAL_MYSQL_USERNAME:${MYSQL_USERNAME:root}}
    password: ${LOCAL_MYSQL_PASSWORD:${MYSQL_PASSWORD:}}
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:${REDIS_HOST:127.0.0.1}}
      port: ${LOCAL_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${LOCAL_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${LOCAL_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: ${LOCAL_REDIS_DATABASE:${REDIS_DATABASE:0}}
      timeout: ${LOCAL_REDIS_TIMEOUT:${REDIS_TIMEOUT:3000ms}}
  security:
    user:
      name: ${SECURITY_DEV_USERNAME:local-dev}
      password: ${SECURITY_DEV_PASSWORD:local-dev-only}

wx:
  miniapp:
    app-id: ${WX_MINIAPP_APP_ID:}
    app-secret: ${WX_MINIAPP_APP_SECRET:}

amap:
  web-service:
    key: ${AMAP_WEB_SERVICE_KEY:}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:local-dev-jwt-secret-change-before-production-2026}
    issuer: ${AUTH_JWT_ISSUER:tongluxing-local}
    access-expire-seconds: ${AUTH_JWT_ACCESS_EXPIRE_SECONDS:7200}
    refresh-expire-seconds: ${AUTH_JWT_REFRESH_EXPIRE_SECONDS:2592000}

vehicle:
  security:
    data-encryption-key: ${VEHICLE_DATA_ENCRYPTION_KEY:${AUTH_JWT_SECRET:local-dev-jwt-secret-change-before-production-2026}}

tongluxing:
  user:
    data-encryption-key: ${USER_DATA_ENCRYPTION_KEY:${AUTH_JWT_SECRET:local-dev-jwt-secret-change-before-production-2026}}
  merchant:
    data-encryption-key: ${MERCHANT_DATA_ENCRYPTION_KEY:${AUTH_JWT_SECRET:local-dev-jwt-secret-change-before-production-2026}}

admin:
  auth:
    username: ${ADMIN_AUTH_USERNAME:admin}
    password: ${ADMIN_AUTH_PASSWORD:${SECURITY_DEV_PASSWORD:local-admin-dev-only}}
    operator-id: ${ADMIN_AUTH_OPERATOR_ID:10001}
    display-name: ${ADMIN_AUTH_DISPLAY_NAME:本地管理员}
    session-expire-seconds: ${ADMIN_AUTH_SESSION_EXPIRE_SECONDS:7200}
    max-failures: ${ADMIN_AUTH_MAX_FAILURES:5}
    failure-window-seconds: ${ADMIN_AUTH_FAILURE_WINDOW_SECONDS:3600}

tencent:
  im:
    provider-type: ${TENCENT_IM_PROVIDER_TYPE:MOCK}
    sdk-app-id: ${TENCENT_IM_SDK_APP_ID:0}
    secret-key: ${TENCENT_IM_SECRET_KEY:}
    admin-user-id: ${TENCENT_IM_ADMIN_USER_ID:administrator}
    expire-seconds: ${TENCENT_IM_EXPIRE_SECONDS:604800}

storage:
  minio:
    endpoint: ${LOCAL_MINIO_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
    public-endpoint: ${LOCAL_MINIO_PUBLIC_ENDPOINT:${MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:9000}}
    access-key: ${LOCAL_MINIO_ACCESS_KEY:${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}}
    secret-key: ${LOCAL_MINIO_SECRET_KEY:${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

logging:
  level:
    com.tongluxing: debug
