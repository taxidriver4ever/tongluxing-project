server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: tongluxing-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/auth-schema.sql
        - classpath:db/user-schema.sql
        - classpath:db/growth-schema.sql
        - classpath:db/invite-schema.sql
        - classpath:db/coupon-schema.sql
        - classpath:db/vehicle-schema.sql
        - classpath:db/trip-schema.sql
        - classpath:db/map-schema.sql
        - classpath:db/team-schema.sql
        - classpath:db/chat-schema.sql
        - classpath:db/match-schema.sql
        - classpath:db/storage-schema.sql
        - classpath:db/driver-track-schema.sql
        - classpath:db/merchant-schema.sql
        - classpath:db/groupbuy-schema.sql
        - classpath:db/order-schema.sql
        - classpath:db/payment-schema.sql
        - classpath:db/verification-schema.sql
        - classpath:db/assessment-schema.sql
        - classpath:db/customer-service-schema.sql
        - classpath:db/notify-schema.sql
        - classpath:db/admin-schema.sql
        - classpath:db/mvp-v3-migration.sql
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: ${REDIS_TIMEOUT}
  security:
    user:
      name: ${SECURITY_DEV_USERNAME}
      password: ${SECURITY_DEV_PASSWORD}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: false

mybatis:
  mapper-locations:
    - classpath*:/mapper/**/*.xml
    - classpath*:/db/*Mapper.xml
    - classpath*:/com/**/mapper/*.xml
  type-aliases-package: com.tongluxing.*.entity
  configuration:
    map-underscore-to-camel-case: true

wx:
  miniapp:
    app-id: ${WX_MINIAPP_APP_ID}
    app-secret: ${WX_MINIAPP_APP_SECRET}

amap:
  web-service:
    key: ${AMAP_WEB_SERVICE_KEY:}
    base-url: ${AMAP_WEB_SERVICE_BASE_URL:https://restapi.amap.com}
    driving-strategy: ${AMAP_DRIVING_STRATEGY:32}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER}
    access-expire-seconds: ${AUTH_JWT_ACCESS_EXPIRE_SECONDS}
    refresh-expire-seconds: ${AUTH_JWT_REFRESH_EXPIRE_SECONDS}

vehicle:
  security:
    # 生产环境必须配置独立密钥；dev 未配置时复用已有高强度 JWT 密钥以兼容本地启动。
    data-encryption-key: ${VEHICLE_DATA_ENCRYPTION_KEY:${AUTH_JWT_SECRET}}

admin:
  auth:
    username: ${ADMIN_AUTH_USERNAME:admin}
    password: ${ADMIN_AUTH_PASSWORD:Admin@123456}
    operator-id: ${ADMIN_AUTH_OPERATOR_ID:10001}
    display-name: ${ADMIN_AUTH_DISPLAY_NAME:运营管理员}
    session-expire-seconds: ${ADMIN_AUTH_SESSION_EXPIRE_SECONDS:7200}
    max-failures: ${ADMIN_AUTH_MAX_FAILURES:5}
    failure-window-seconds: ${ADMIN_AUTH_FAILURE_WINDOW_SECONDS:3600}

tencent:
  im:
    sdk-app-id: ${TENCENT_IM_SDK_APP_ID}
    secret-key: ${TENCENT_IM_SECRET_KEY}
    admin-user-id: ${TENCENT_IM_ADMIN_USER_ID}
    expire-seconds: ${TENCENT_IM_EXPIRE_SECONDS}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET:tongluxing}
    upload-expire-seconds: ${MINIO_UPLOAD_EXPIRE_SECONDS:600}
    download-expire-seconds: ${MINIO_DOWNLOAD_EXPIRE_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.tongluxing: debug

# MVP 轨迹风控阈值：后台首轮内测只读，统一配置，禁止业务代码散落硬编码。
trajectory:
  moving-sample-seconds: ${TRAJECTORY_MOVING_SAMPLE_SECONDS:5}
  stationary-sample-seconds: ${TRAJECTORY_STATIONARY_SAMPLE_SECONDS:10}
  min-segment-seconds: ${TRAJECTORY_MIN_SEGMENT_SECONDS:2}
  normal-segment-max-seconds: ${TRAJECTORY_NORMAL_SEGMENT_MAX_SECONDS:20}
  gap-segment-max-seconds: ${TRAJECTORY_GAP_SEGMENT_MAX_SECONDS:60}
  normal-accuracy-meters: ${TRAJECTORY_NORMAL_ACCURACY_METERS:30}
  acceptable-accuracy-meters: ${TRAJECTORY_ACCEPTABLE_ACCURACY_METERS:80}
  low-confidence-accuracy-meters: ${TRAJECTORY_LOW_CONFIDENCE_ACCURACY_METERS:50}
  stationary-drift-meters: ${TRAJECTORY_STATIONARY_DRIFT_METERS:8}
  stationary-drift-speed-kmh: ${TRAJECTORY_STATIONARY_DRIFT_SPEED_KMH:3}
  waypoint-radius-meters: ${TRAJECTORY_WAYPOINT_RADIUS_METERS:100}
  waypoint-min-points: ${TRAJECTORY_WAYPOINT_MIN_POINTS:2}
  waypoint-min-duration-seconds: ${TRAJECTORY_WAYPOINT_MIN_DURATION_SECONDS:10}
  waypoint-evidence-window-seconds: ${TRAJECTORY_WAYPOINT_EVIDENCE_WINDOW_SECONDS:30}
  acceleration-max-segment-seconds: ${TRAJECTORY_ACCELERATION_MAX_SEGMENT_SECONDS:10}
  destination-radius-meters: ${TRAJECTORY_DESTINATION_RADIUS_METERS:100}
  destination-min-points: ${TRAJECTORY_DESTINATION_MIN_POINTS:3}
  destination-min-duration-seconds: ${TRAJECTORY_DESTINATION_MIN_DURATION_SECONDS:15}
  valid-point-ratio-percent: ${TRAJECTORY_VALID_POINT_RATIO_PERCENT:70}
  critical-valid-point-ratio-percent: ${TRAJECTORY_CRITICAL_VALID_POINT_RATIO_PERCENT:50}
  normal-speed-max-kmh: ${TRAJECTORY_NORMAL_SPEED_MAX_KMH:160}
  warning-speed-max-kmh: ${TRAJECTORY_WARNING_SPEED_MAX_KMH:200}
  fatal-speed-kmh: ${TRAJECTORY_FATAL_SPEED_KMH:1000}
  suspicious-acceleration-mps2: ${TRAJECTORY_SUSPICIOUS_ACCELERATION_MPS2:8}
  abnormal-acceleration-mps2: ${TRAJECTORY_ABNORMAL_ACCELERATION_MPS2:12}
  teleport-five-seconds-meters: ${TRAJECTORY_TELEPORT_5S_METERS:300}
  teleport-ten-seconds-meters: ${TRAJECTORY_TELEPORT_10S_METERS:600}
  medium-risk-score: ${TRAJECTORY_MEDIUM_RISK_SCORE:5}
  high-risk-score: ${TRAJECTORY_HIGH_RISK_SCORE:10}
  max-future-location-seconds: ${TRAJECTORY_MAX_FUTURE_LOCATION_SECONDS:300}
  low-confidence-max-bearing-change-degrees: ${TRAJECTORY_LOW_CONFIDENCE_MAX_BEARING_CHANGE_DEGREES:150}
  round-trip-window-seconds: ${TRAJECTORY_ROUND_TRIP_WINDOW_SECONDS:60}
  round-trip-far-distance-meters: ${TRAJECTORY_ROUND_TRIP_FAR_DISTANCE_METERS:300}
  round-trip-return-radius-meters: ${TRAJECTORY_ROUND_TRIP_RETURN_RADIUS_METERS:100}
