services:
  mysql:
    image: mysql:8.0
    container_name: tongdao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - tongdao_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USERNAME} -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tongdao-network

  redis:
    image: redis:7-alpine
    container_name: tongdao-redis
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --user
      - default
      - "off"
      - --user
      - ${REDIS_USERNAME}
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"
    volumes:
      - tongdao_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user \"$${REDIS_USERNAME}\" -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tongdao-network

volumes:
  tongdao_mysql_data:
  tongdao_redis_data:

networks:
  tongdao-network:
    driver: bridge
